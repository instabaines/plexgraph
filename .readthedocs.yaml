# Read the Docs configuration: build the mkdocs site.
# The API reference pages import plexgraph/plexgraph_core/plexgraph_bridge, so those three source
# packages are installed editable first (mirroring .github/workflows/ci.yml's mypy job), then the
# doc-building tools from docs/requirements.txt.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: packages/core
      extra_requirements:
        - all
    - method: pip
      path: packages/bridge
      extra_requirements:
        - jupyter
    - method: pip
      path: packages/plexgraph
    - requirements: docs/requirements.txt
