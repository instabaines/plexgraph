# Read the Docs configuration: build the mkdocs site.
#
# The API reference pages (docs/api/*.md) pull docstrings from plexgraph/plexgraph_core/plexgraph_bridge, but
# mkdocstrings' Python handler (griffe) reads them by statically parsing the source under mkdocs.yml's
# `handlers.python.paths` -- it does not import the packages, so they do not need to be installed here. (Installing
# packages/bridge in particular would fail: its build force-includes the pre-built frontend at packages/app/dist,
# which only exists after `pnpm --filter @plexgraph/app build`, a step this docs-only build never runs.) Verified by
# building with only docs/requirements.txt installed and none of the three packages present.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
