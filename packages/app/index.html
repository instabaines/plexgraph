<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hyperloom</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fafafa; }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        font: 12px system-ui, sans-serif;
        color: #666;
        background: rgba(255, 255, 255, 0.8);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      #timeline {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.9);
        font: 12px system-ui, sans-serif;
        color: #444;
        box-sizing: border-box;
      }
      #timeline[hidden] { display: none; }
      #timeline input[type="range"] { flex: 1; }
      #timeline-value { min-width: 8ch; text-align: right; font-variant-numeric: tabular-nums; }
      #timeline button {
        font: inherit;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #right-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
        max-height: 95vh;
      }
      #right-panel > * {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 4px;
        font: 12px system-ui, sans-serif;
        color: #444;
      }
      #right-panel > [hidden] { display: none; }
      #layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
      #layers .swatch,
      #node-color-legend .swatch,
      #edge-color-legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
      #node-color-legend .row,
      #edge-color-legend .row { display: flex; align-items: center; gap: 6px; }
      #node-color-legend .title,
      #edge-color-legend .title { font-weight: 600; }
      #view-mode {
        position: fixed;
        top: 40px;
        left: 8px;
        display: flex;
        gap: 4px;
        font: 12px system-ui, sans-serif;
      }
      #view-mode[hidden] { display: none; }
      #view-mode button {
        font: inherit;
        border: 1px solid #ccc;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #view-mode button[aria-pressed="true"] {
        background: #333;
        color: #fff;
        border-color: #333;
      }
      #stack-legend {
        font-size: 11px;
        overflow-y: auto;
      }
      #stack-legend .row { display: flex; align-items: center; gap: 6px; }
      #stack-legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
      #export {
        position: fixed;
        top: 72px;
        left: 8px;
        font: 12px system-ui, sans-serif;
      }
      #export-toggle {
        font: inherit;
        border: 1px solid #ccc;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #export-menu {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #ccc;
        border-radius: 4px;
        overflow: hidden;
        min-width: 120px;
      }
      #export-menu[hidden] { display: none; }
      #export-menu button {
        font: inherit;
        border: none;
        background: none;
        padding: 6px 10px;
        text-align: left;
        cursor: pointer;
      }
      #export-menu button:hover { background: #f0f0f0; }
    </style>
  </head>
  <body>
    <div id="status" hidden></div>
    <canvas id="canvas"></canvas>
    <div id="view-mode" hidden>
      <button id="view-flat" type="button" aria-pressed="true">Flat</button>
      <button id="view-stack-layer" type="button" hidden>Stack: layers</button>
      <button id="view-stack-time" type="button" hidden>Stack: time</button>
    </div>
    <div id="export">
      <button id="export-toggle" type="button">Export ▾</button>
      <div id="export-menu" hidden>
        <button data-format="png" type="button">PNG image</button>
        <button data-format="jpg" type="button">JPG image</button>
        <button data-format="svg" type="button">SVG vector</button>
        <button data-format="html" type="button">HTML page</button>
        <button data-format="pdf" type="button">PDF document</button>
      </div>
    </div>
    <div id="timeline" hidden>
      <button id="timeline-toggle" type="button">All time</button>
      <input id="timeline-slider" type="range" min="0" max="1" step="any" value="0" />
      <span id="timeline-value"></span>
    </div>
    <div id="right-panel">
      <div id="layers" hidden></div>
      <div id="stack-legend" hidden></div>
      <div id="node-color-legend" hidden></div>
      <div id="edge-color-legend" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
