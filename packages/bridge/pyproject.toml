[project]
name = "hyperloom-bridge"
version = "0.1.0"
description = "Local WebSocket server bridging hyperloom-core and the browser frontend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "hyperloom-core",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ipython",
    "ipykernel",
    "nbclient",
    "nbformat",
    "jupyter_client",
]
jupyter = [
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperloom_bridge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
hyperloom-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
