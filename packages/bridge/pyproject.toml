[project]
name = "plexgraph-bridge"
version = "0.1.1"
description = "Local WebSocket server bridging plexgraph-core and the browser frontend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "plexgraph-core",
    "numpy>=1.26",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ipython",
    "ipykernel",
    "nbclient",
    "nbformat",
    "jupyter_client",
]
jupyter = [
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plexgraph_bridge"]

# Ship the built viewer inside the wheel so `show()` works after a plain `pip install`. Build it first:
#   pnpm install && pnpm --filter @plexgraph/app build
# Building the wheel fails loudly if packages/app/dist is missing, rather than producing a wheel that
# cannot open a viewer.
[tool.hatch.build.targets.wheel.force-include]
"../app/dist" = "plexgraph_bridge/static"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
plexgraph-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
