[project]
name = "plexgraph-core"
version = "0.1.0"
description = "Core graph model (IR), algorithms, and I/O for plexgraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "msgpack>=1.0",
]

# Optional integrations. Each backs a public loader and is imported only when that loader is used:
#   pandas   -> from_pandas_edgelist, from_pandas_temporal_edgelist (you pass a DataFrame)
#   networkx -> from_networkx, from_gexf, from_graphml
[project.optional-dependencies]
pandas = ["pandas>=2.0"]
networkx = ["networkx>=3.0"]
all = ["pandas>=2.0", "networkx>=3.0"]
dev = [
    "pytest>=8.0",
    "networkx>=3.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plexgraph_core"]
