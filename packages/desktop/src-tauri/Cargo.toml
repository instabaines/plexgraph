[package]
name = "plexgraph-desktop"
version = "0.1.0"
description = "plexgraph desktop app: a Tauri shell around the existing web viewer, talking to a local Python sidecar"
authors = ["instabaines"]
license = "MIT"
repository = "https://github.com/instabaines/plexgraph"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "plexgraph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rand = "0.8"
url = "2"
ctrlc = { version = "3", features = ["termination"] }
tauri-plugin-dialog = "2"
