# Development facade: makes `import plexgraph` work in the monorepo checkout by depending on the two source packages.
# It is never published. The distribution users install is assembled by scripts/build_release.py (see docs/releasing.md).
[project]
name = "plexgraph"
version = "0.1.1"
description = "Development facade for the plexgraph monorepo"
requires-python = ">=3.11"
dependencies = [
    "plexgraph-core",
    "plexgraph-bridge",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plexgraph"]

[tool.uv.sources]
plexgraph-core = { workspace = true }
plexgraph-bridge = { workspace = true }
